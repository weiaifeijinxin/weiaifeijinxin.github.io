<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查信 - 时间胶囊</title>
    <link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/home.css">
    <link rel="stylesheet" href="styles/query.css">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-container">
            <div class="logo-text" onclick="window.location.href='index.html'" style="cursor: pointer;">时间胶囊</div>
            <div class="nav-links">
                <a href="write.html">写信</a>
                <a href="capsule.html">时间胶囊</a>
                <a href="mailbox.html">时光信箱</a>
                <a href="query.html" style="color: var(--accent-color); font-weight: bold;">查信</a>
                <a href="about.html">关于</a>
            </div>
        </div>
    </nav>

    <main class="query-container">
        <div class="search-section">
            <div class="search-title">查 询 信 件</div>
            <p class="search-desc">输入收件邮箱，找回属于你的时光信件</p>

            <form class="search-form" id="searchForm">
                <input type="email" id="emailInput" class="search-input" placeholder="输入收件邮箱地址" required>
                <button type="submit" id="queryBtn" class="search-btn">查询</button>
            </form>

            <div class="initial-hint">
                <p>输入你收信时预留的邮箱，即可查询所有寄给你的信件</p>
                <p class="daily-limit" id="dailyHint">每日限查询 3 次 · 今日剩余 <span id="remainCount">3</span> 次</p>
            </div>
        </div>

        <!-- 加载状态 -->
        <div class="status-area">
            <div class="loading-state" id="loadingState">
                <div class="loading-spinner"></div>
                <span class="loading-text">正在查询你的信件...</span>
            </div>

            <!-- 空状态 -->
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                </div>
                <div class="empty-title">暂无信件</div>
                <div class="empty-desc">该邮箱暂无已送达的信件，请检查邮箱地址是否正确</div>
            </div>

            <!-- 错误状态 -->
            <div class="error-state" id="errorState">
                <div class="error-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                </div>
                <div class="error-title" id="errorTitle">查询失败</div>
                <div class="error-desc" id="errorDesc">请稍后重试</div>
                <button class="retry-btn" id="retryBtn">重新查询</button>
            </div>
        </div>

        <!-- 结果区 -->
        <div class="result-section" id="resultSection">
            <div class="result-count" id="resultCount"></div>
            <div class="result-list" id="resultList"></div>
        </div>
    </main>

    <script>
        const API_HEADERS = {
            'X-Bmob-Application-Id': '075c9e426a01a48a81aa12305924e532',
            'X-Bmob-REST-API-Key': 'a92fd1416101a7ee4de0ee0850572b91',
            'Content-Type': 'application/json'
        };

        const form = document.getElementById('searchForm');
        const emailInput = document.getElementById('emailInput');
        const queryBtn = document.getElementById('queryBtn');
        const loadingState = document.getElementById('loadingState');
        const emptyState = document.getElementById('emptyState');
        const errorState = document.getElementById('errorState');
        const errorTitle = document.getElementById('errorTitle');
        const errorDesc = document.getElementById('errorDesc');
        const retryBtn = document.getElementById('retryBtn');
        const resultSection = document.getElementById('resultSection');
        const resultCount = document.getElementById('resultCount');
        const resultList = document.getElementById('resultList');
        const remainSpan = document.getElementById('remainCount');

        let lastEmail = '';
        let currentItems = [];

        // ===== 每日 3 次限制（localStorage 存） =====
        function getQueryCount() {
            var key = 'timecapsule_query_date';
            var countKey = 'timecapsule_query_count';
            var today = new Date().toDateString();
            if (localStorage.getItem(key) !== today) {
                localStorage.setItem(key, today);
                localStorage.setItem(countKey, '0');
                return 0;
            }
            return parseInt(localStorage.getItem(countKey) || '0');
        }

        function incQueryCount() {
            var count = getQueryCount() + 1;
            localStorage.setItem('timecapsule_query_count', String(count));
            updateRemain();
            return count;
        }

        function updateRemain() {
            var used = getQueryCount();
            var remain = Math.max(0, 3 - used);
            if (remainSpan) remainSpan.textContent = remain;
        }

        function canQuery() {
            return getQueryCount() < 3;
        }

        updateRemain();

        function showLoading() {
            loadingState.classList.add('active');
            emptyState.classList.remove('active');
            errorState.classList.remove('active');
            resultSection.classList.remove('active');
            queryBtn.disabled = true;
            queryBtn.textContent = '查询中...';
        }

        function hideLoading() {
            loadingState.classList.remove('active');
            queryBtn.disabled = false;
            queryBtn.textContent = '查询';
        }

        function showError(title, desc) {
            hideLoading();
            errorTitle.textContent = title || '查询失败';
            errorDesc.textContent = desc || '请稍后重试';
            errorState.classList.add('active');
        }

        function showEmpty() {
            hideLoading();
            emptyState.classList.add('active');
        }

        function escHtml(text) {
            var d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function renderResults(jsonData) {
            hideLoading();

            var parsed = jsonData;
            if (parsed.result && typeof parsed.result === 'string') {
                try { parsed = JSON.parse(parsed.result); } catch(e) {}
            }
            var items = parsed.data || parsed.results || (Array.isArray(parsed) ? parsed : []);

            if (items.length === 0) {
                showEmpty();
                return;
            }

            currentItems = items;
            resultCount.textContent = '共找到 ' + items.length + ' 封信件，点击卡片查看详情';

            resultList.innerHTML = items.map(function(item, idx) {
                var content = item.content || '(无内容)';
                var tag = item.tableLabel || '信件';
                var date = item.sendTime || '未知';
                var from = item.from || '未知';
                var imgUrl = item.imageUrl || null;
                var imgHtml = imgUrl ? '<img class="card-image" src="' + escHtml(imgUrl) + '" alt="配图" onerror="this.style.display=\'none\'">' : '';
                var shortContent = content.length > 120 ? content.slice(0, 120) + '...' : content;
                return '<div class="result-card" onclick="openDetail(' + idx + ')">'
                    + imgHtml
                    + '<div class="card-body">'
                    + '<span class="card-tag">' + escHtml(tag) + '</span>'
                    + '<div class="card-content">' + escHtml(shortContent) + '</div>'
                    + '<div class="card-meta">'
                    + '<span class="card-date">发送日期：' + escHtml(date) + '</span>'
                    + '<span class="card-from">来自：' + escHtml(from) + '</span>'
                    + '</div></div></div>';
            }).join('');

            resultSection.classList.add('active');
        }

        // ===== 全屏详情视图（替换列表） =====
        var currentDetailIdx = -1;

        function openDetail(idx) {
            currentDetailIdx = idx;
            var item = currentItems[idx];
            if (!item) return;

            // 隐藏列表，显示详情
            resultList.style.display = 'none';
            resultCount.style.display = 'none';

            // 创建或显示详情容器
            var detailView = document.getElementById('detailView');
            if (!detailView) {
                detailView = document.createElement('div');
                detailView.id = 'detailView';
                detailView.className = 'detail-view';
                resultSection.appendChild(detailView);
            }
            detailView.style.display = 'block';
            detailView.scrollTop = 0;

            // 构建详情内容
            var imgHtml = '';
            if (item.imageUrl) {
                imgHtml = '<div class="detail-image-wrap"><img src="' + escHtml(item.imageUrl) + '" alt="配图"></div>';
            }

            detailView.innerHTML = ''
                + '<div class="detail-header">'
                + '<button class="detail-back" onclick="closeDetail()">← 返回列表</button>'
                + '<span class="detail-index">' + (idx + 1) + ' / ' + currentItems.length + '</span>'
                + '</div>'
                + '<div class="detail-tag">' + escHtml(item.tableLabel || '信件') + '</div>'
                + '<div class="detail-from">来自：' + escHtml(item.from || '未知') + '</div>'
                + '<div class="detail-date">发送日期：' + escHtml(item.sendTime || '未知') + '</div>'
                + imgHtml
                + '<div class="detail-body">' + escHtml(item.content || '(无内容)') + '</div>'
                + '<div class="detail-actions">'
                + '<button class="detail-btn" onclick="copyContent()">📋 复制全文</button>'
                + '<button class="detail-btn" onclick="downloadLetter()">⬇️ 下载文本</button>'
                + '</div>'
                + '<div class="detail-nav">'
                + '<button class="nav-btn" onclick="prevLetter()" id="prevBtn">← 上一封</button>'
                + '<button class="nav-btn" onclick="nextLetter()" id="nextBtn">下一封 →</button>'
                + '</div>';

            // 更新上下翻按钮状态
            document.getElementById('prevBtn').disabled = (idx === 0);
            document.getElementById('nextBtn').disabled = (idx === currentItems.length - 1);

            // 滚动到顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeDetail() {
            var detailView = document.getElementById('detailView');
            if (detailView) detailView.style.display = 'none';
            resultList.style.display = '';
            resultCount.style.display = '';
        }

        function prevLetter() {
            if (currentDetailIdx > 0) openDetail(currentDetailIdx - 1);
        }

        function nextLetter() {
            if (currentDetailIdx < currentItems.length - 1) openDetail(currentDetailIdx + 1);
        }

        function copyContent() {
            var item = currentItems[currentDetailIdx];
            if (!item) return;
            var text = '来自：' + (item.from || '未知') + '\n'
                     + '发送日期：' + (item.sendTime || '未知') + '\n'
                     + '分类：' + (item.tableLabel || '信件') + '\n\n'
                     + (item.content || '');

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    showToast('✅ 已复制到剪贴板');
                }).catch(function() {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast('✅ 已复制到剪贴板');
            } catch(e) {
                showToast('复制失败，请手动选择复制');
            }
            document.body.removeChild(ta);
        }

        function downloadLetter() {
            var item = currentItems[currentDetailIdx];
            if (!item) return;

            var text = '═══════════════════════════\n'
                     + '    时间胶囊 - 寄往未来的信\n'
                     + '═══════════════════════════\n\n'
                     + '分类：' + (item.tableLabel || '信件') + '\n'
                     + '发送日期：' + (item.sendTime || '未知') + '\n'
                     + '来自：' + (item.from || '未知') + '\n\n'
                     + '───────────────────────────\n\n'
                     + (item.content || '(无内容)') + '\n\n'
                     + '───────────────────────────\n'
                     + '此信由【时间胶囊】App寄出\n'
                     + 'https://weiaifeijinxin.github.io\n';

            var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = '时间胶囊-信件-' + (item.sendTime || '未知') + '.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showToast(msg) {
            var t = document.getElementById('toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toast';
                t.className = 'toast';
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(function() { t.classList.remove('show'); }, 2000);
        }

        async function queryLetters(email) {
            if (!canQuery()) {
                showError('今日查询次数已用完', '每天限查询 3 次，明天再来吧');
                return;
            }

            showLoading();
            try {
                var response = await fetch('https://api.codenow.cn/1/functions/queryLetters', {
                    method: 'POST',
                    headers: API_HEADERS,
                    body: JSON.stringify({ email: email })
                });

                if (!response.ok) {
                    throw new Error('服务器返回错误：' + response.status);
                }

                var result = await response.json();
                incQueryCount();
                renderResults(result);
            } catch (err) {
                if (err instanceof TypeError && err.message.includes('Failed to fetch')) {
                    showError('网络连接失败', '请检查网络连接后重试');
                } else {
                    showError('查询失败', err.message);
                }
            }
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            var email = emailInput.value.trim();
            if (!email) {
                showError('请输入邮箱', '请填写收件邮箱地址');
                return;
            }
            // 关闭详情
            closeDetail();
            lastEmail = email;
            queryLetters(email);
        });

        retryBtn.addEventListener('click', function() {
            if (lastEmail) {
                queryLetters(lastEmail);
            }
        });
    </script>
</body>
</html>
